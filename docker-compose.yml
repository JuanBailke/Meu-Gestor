services:
  db:
    image: postgres:15-alpine
    container_name: postgres-meu-gestor
    environment:
      POSTGRES_DB: meu_gestor
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: